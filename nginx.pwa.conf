server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed build assets never change under the same name — cache aggressively.
    location /pwa_app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # App shell / service worker / manifest must always revalidate so a new deploy
    # is picked up immediately instead of a stale copy (also nudges CDNs not to pin them).
    location = /pwa_app/index.html           { add_header Cache-Control "no-cache"; }
    location = /pwa_app/registerSW.js        { add_header Cache-Control "no-cache"; }
    location = /pwa_app/sw.js                { add_header Cache-Control "no-cache"; }
    location = /pwa_app/manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # SPA fallback: unknown paths under the base resolve to the app entry point.
    location /pwa_app/ {
        try_files $uri $uri/ /pwa_app/index.html;
    }
}
