server {
    listen 80;
    root /usr/share/nginx/html;

    # Kong forwards with preserve_host=false, so nginx sees Host: pwa-app — the internal
    # Docker service name. An absolute redirect would build its Location from that and
    # send http://pwa-app/... to the browser, which cannot resolve it. Relative Locations
    # resolve against whatever origin the client actually used.
    absolute_redirect off;

    # /pwa_app -> /pwa_app/. nginx would redirect here anyway, having found a directory of
    # that name, but only because of how the Dockerfile lays dist out; say it outright.
    location = /pwa_app { return 301 /pwa_app/; }

    # Hashed build assets never change under the same name — cache aggressively.
    location /pwa_app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # App shell / service worker / manifest must always revalidate so a new deploy
    # is picked up immediately instead of a stale copy (also nudges CDNs not to pin them).
    location = /pwa_app/index.html           { add_header Cache-Control "no-cache"; }
    location = /pwa_app/sw.js                { add_header Cache-Control "no-cache"; }
    location = /pwa_app/manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # SPA fallback: unknown paths under the base resolve to the app entry point.
    # try_files' internal redirect re-enters the `= /pwa_app/index.html` block above, so
    # these responses would carry no-cache regardless; repeating it keeps the guarantee
    # local to the block that serves the app shell rather than resting on that behaviour.
    location /pwa_app/ {
        try_files $uri $uri/ /pwa_app/index.html;
        add_header Cache-Control "no-cache";
    }
}
