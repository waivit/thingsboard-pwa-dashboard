name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            bash /opt/dashboard-pwa/deploy.sh

      # Push "new version" to subscribed phones, only when the head commit asks for it
      # with [notify] — small fixes should not ping everyone.
      - name: Announce update
        if: contains(github.event.head_commit.message, '[notify]')
        env:
          ANNOUNCE_KEY: ${{ secrets.ANNOUNCE_KEY }}
        run: |
          curl -fsS -X POST https://nonthaburi.info/pwa_push/announce-update \
            -H "X-Announce-Key: $ANNOUNCE_KEY"
